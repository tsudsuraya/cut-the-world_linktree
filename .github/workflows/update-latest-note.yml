name: Update latest note article

on:
  schedule:
    - cron: "15 21 * * *" # 06:15 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-note
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      # RSS取得に失敗するとここで exit 1 になり、コミットされず既存表示が維持される
      - name: Fetch latest note article
        run: python3 scripts/update_latest.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: update latest note article"
          git push
